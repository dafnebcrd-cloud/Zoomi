<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoomi</title>
  <!-- Volvemos a conectar tu archivo de estilos original -->
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilo ligero para la caja de mensajes de error/éxito */
    .alert-message {
      display: none;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE FONDO / APP PRINCIPAL -->
  <div id="mainApp">
    <!-- Aquí se conserva tu interfaz visual de lecciones, fondo y logos -->
  </div>

  <!-- MODAL DE AUTENTICACIÓN -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modalTitle">Iniciar Sesión</h2>
      
      <!-- Mensaje de alerta para errores o confirmación -->
      <div id="authAlert" class="alert-message"></div>

      <form id="authForm">
        <div class="input-group">
          <label for="authEmail">Correo electrónico:</label>
          <input type="email" id="authEmail" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="input-group">
          <label for="authPassword">Contraseña:</label>
          <input type="password" id="authPassword" placeholder="••••••••" required>
        </div>

        <div class="button-group">
          <button type="button" id="cancelBtn" class="btn-secondary">Cancelar</button>
          <button type="submit" id="submitAuthBtn" class="btn-primary">Ingresar</button>
        </div>
      </form>

      <div class="toggle-mode-container">
        <p id="toggleText">¿No tienes cuenta? <a href="#" id="switchAuthLink">Regístrate aquí</a></p>
      </div>
    </div>
  </div>

  <!-- CÓDIGO DE SEGURIDAD Y FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      sendEmailVerification, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "TU_API_KEY_AQUÍ",
      authDomain: "zoomi-aa021.firebaseapp.com",
      projectId: "zoomi-aa021",
      storageBucket: "zoomi-aa021.appspot.com",
      messagingSenderId: "TU_MESSAGING_SENDER_ID",
      appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const authModal = document.getElementById("authModal");
    const modalTitle = document.getElementById("modalTitle");
    const authForm = document.getElementById("authForm");
    const authEmail = document.getElementById("authEmail");
    const authPassword = document.getElementById("authPassword");
    const submitAuthBtn = document.getElementById("submitAuthBtn");
    const toggleText = document.getElementById("toggleText");
    const authAlert = document.getElementById("authAlert");
    const cancelBtn = document.getElementById("cancelBtn");

    let isRegisterMode = false;

    function showAlert(message, isError = true) {
      authAlert.textContent = message;
      authAlert.style.color = isError ? "#721c24" : "#155724";
      authAlert.style.backgroundColor = isError ? "#f8d7da" : "#d4edda";
      authAlert.style.border = isError ? "1px solid #f5c6cb" : "1px solid #c3e6cb";
      authAlert.style.display = "block";
    }

    function clearAlert() {
      authAlert.style.display = "none";
      authAlert.textContent = "";
    }

    function setAuthMode(register) {
      isRegisterMode = register;
      clearAlert();
      authForm.reset();

      if (isRegisterMode) {
        modalTitle.textContent = "Crear Cuenta";
        submitAuthBtn.textContent = "Registrarse";
        toggleText.innerHTML = '¿Ya tienes cuenta? <a href="#" id="switchAuthLink">Inicia sesión aquí</a>';
      } else {
        modalTitle.textContent = "Iniciar Sesión";
        submitAuthBtn.textContent = "Ingresar";
        toggleText.innerHTML = '¿No tienes cuenta? <a href="#" id="switchAuthLink">Regístrate aquí</a>';
      }

      document.getElementById("switchAuthLink").addEventListener("click", (e) => {
        e.preventDefault();
        setAuthMode(!isRegisterMode);
      });
    }

    setAuthMode(false);

    function isPasswordStrong(password) {
      const regex = /^(?=.*[A-Z])(?=.*\d).{8,}$/;
      return regex.test(password);
    }

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();

      const email = authEmail.value.trim();
      const password = authPassword.value;

      if (isRegisterMode) {
        if (!isPasswordStrong(password)) {
          showAlert("La contraseña debe tener al menos 8 caracteres, incluir una mayúscula y un número.");
          return;
        }

        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          await sendEmailVerification(user);
          await signOut(auth);

          showAlert("¡Cuenta creada! Se envió un correo de confirmación. Por favor verifícalo antes de ingresar.", false);
          
          setTimeout(() => {
            setAuthMode(false);
          }, 4000);

        } catch (error) {
          if (error.code === 'auth/email-already-in-use') {
            showAlert("Este correo ya está registrado. Cambia a 'Iniciar sesión'.");
          } else {
            showAlert("Error al registrarse: " + error.message);
          }
        }

      } else {
        try {
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          if (!user.emailVerified) {
            showAlert("Tu correo aún no ha sido verificado. Revisa tu bandeja de entrada.");
            await signOut(auth);
            return;
          }

          authModal.style.display = "none";

        } catch (error) {
          showAlert("Correo o contraseña incorrectos.");
        }
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user && user.emailVerified) {
        authModal.style.display = "none";
      } else {
        authModal.style.display = "flex";
      }
    });

    cancelBtn.addEventListener("click", () => {
      authForm.reset();
      clearAlert();
    });
  </script>
</body>
</html>
