<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoomi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5dc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            background-color: #fffdfa;
            border: 3px solid #b71c1c;
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            height: 550px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            gap: 25px;
        }

        .logo-img-main {
            max-width: 280px;
            height: auto;
            object-fit: contain;
        }

        .btn-login {
            background-color: #fbf3e7;
            color: #8b0000;
            border: 2px solid #8b0000;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: #8b0000;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <img src="zoomi-logo.png" alt="Logo Zoomi" class="logo-img-main">
        <button class="btn-login" onclick="openLogoutModal()">Iniciar sesión</button>
    </div>

</body>
</html>
