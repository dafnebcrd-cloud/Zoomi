<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoomi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PANTALLA PRINCIPAL / FONDO DE ZOOMI -->
  <div id="mainApp" class="background-container">
    <header class="app-header">
      <img src="zoomi-logo.png" alt="Zoomi Logo" class="app-logo">
      <h1 id="welcomeUserMessage">Bienvenido a Zoomi</h1>
      <button id="logoutBtn" class="btn-primary" style="display: none; width: auto;">Cerrar sesión</button>
    </header>

    <main class="content-body">
      <!-- Iconos de navegación con tus archivos de imagen -->
      <nav class="nav-icons">
        <img src="Casita!.png" alt="Inicio" class="nav-icon">
        <img src="Lecciones!.png" alt="Lecciones" class="nav-icon">
        <img src="Yo!.png" alt="Perfil" class="nav-icon">
        <img src="Ajustes!.png" alt="Ajustes" class="nav-icon">
      </nav>
    </main>
  </div>

  <!-- MODAL DE AUTENTICACIÓN Y SEGURIDAD -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modalTitle">Iniciar Sesión</h2>
      
      <!-- Mensaje de error/éxito -->
      <div id="authAlert" class="alert-message" style="display: none;"></div>

      <form id="authForm">
        <div class="input-group">
          <label for="authEmail">Correo electrónico:</label>
          <input type="email" id="authEmail" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="input-group">
          <label for="authPassword">Contraseña:</label>
          <input type="password" id="authPassword" placeholder="••••••••" required>
        </div>

        <div class="button-group">
          <button type="button" id="cancelBtn" class="btn-secondary">Cancelar</button>
          <button type="submit" id="submitAuthBtn" class="btn-primary">Ingresar</button>
        </div>
      </form>

      <div class="toggle-mode-container">
        <p id="toggleText">¿No tienes cuenta? <a href="#" id="switchAuthLink">Regístrate aquí</a></p>
      </div>
    </div>
  </div>

  <!-- VÍNCULO A TU SCRIPT MAIN.JS -->
  <script type="module" src="main.js"></script>
</body>
</html>
