<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoomi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5dc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            background-color: #fffdfa;
            border: 3px solid #b71c1c;
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            height: 550px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            gap: 25px;
        }

        .logo-img-main {
            max-width: 280px;
            height: auto;
            object-fit: contain;
        }

        .btn-login {
            background-color: #fbf3e7;
            color: #8b0000;
            border: 2px solid #8b0000;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: #8b0000;
            color: #ffffff;
        }

        /* Modal Agrandado */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #fffdfa;
            border: 3px solid #8b0000;
            border-radius: 20px;
            padding: 40px;
            width: 450px; /* Ventana más ancha */
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            color: #8b0000;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 1rem;
            color: #333;
            font-weight: bold;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
        }

        .input-group input:focus {
            border-color: #8b0000;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            user-select: none;
            font-size: 1.2rem;
        }

        .message {
            font-size: 0.95rem;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .error-message { color: #d32f2f; }
        .success-message { color: #2e7d32; }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            gap: 15px;
        }

        .btn-submit {
            background-color: #8b0000;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            flex: 1;
        }

        .btn-cancel {
            background-color: #e0e0e0;
            color: #333;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            flex: 1;
        }

        .switch-mode {
            font-size: 0.95rem;
            text-align: center;
            color: #8b0000;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <img src="zoomi-logo.png" alt="Logo Zoomi" class="logo-img-main">
        <button class="btn-login" onclick="openLogoutModal()">Iniciar sesión</button>
    </div>

    <!-- Modal para Login y Registro -->
    <div class="modal" id="modal-logout">
        <div class="modal-content">
            <h2 id="modal-title">Iniciar Sesión</h2>
            
            <div class="input-group">
                <label for="login_email">Correo electrónico:</label>
                <input type="email" id="login_email" placeholder="usuario@zoomi.com">
            </div>

            <div class="input-group">
                <label for="login_password">Contraseña:</label>
                <div class="password-wrapper">
                    <input type="password" id="login_password" placeholder="••••••••">
                    <span class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
                </div>
            </div>

            <div id="modal-msg" class="message"></div>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeLogoutModal()">Cancelar</button>
                <button class="btn-submit" id="btn-action" onclick="handleAuth()">Ingresar</button>
            </div>

            <div class="switch-mode" id="switch-btn" onclick="toggleMode()">
                ¿No tienes cuenta? Regístrate aquí
            </div>
        </div>
    </div>

    <script>
        let isRegisterMode = false;

        // Cargar usuarios guardados o crear una base inicial si está vacía
        function getStoredUsers() {
            let users = localStorage.getItem('zoomi_users');
            if (!users) {
                const defaultUsers = {
                    "admin@zoomi.com": "123456"
                };
                localStorage.setItem('zoomi_users', JSON.stringify(defaultUsers));
                return defaultUsers;
            }
            return JSON.parse(users);
        }

        function openLogoutModal() {
            document.getElementById('modal-logout').classList.add('active');
            clearForm();
        }

        function closeLogoutModal() {
            document.getElementById('modal-logout').classList.remove('active');
            clearForm();
        }

        function clearForm() {
            document.getElementById('login_email').value = '';
            document.getElementById('login_password').value = '';
            document.getElementById('login_password').type = 'password';
            const msg = document.getElementById('modal-msg');
            msg.style.display = 'none';
            msg.className = 'message';
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('login_password');
            passInput.type = (passInput.type === 'password') ? 'text' : 'password';
        }

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            clearForm();

            const title = document.getElementById('modal-title');
            const btnAction = document.getElementById('btn-action');
            const switchBtn = document.getElementById('switch-btn');

            if (isRegisterMode) {
                title.innerText = 'Registrarse';
                btnAction.innerText = 'Crear cuenta';
                switchBtn.innerText = '¿Ya tienes cuenta? Inicia sesión';
            } else {
                title.innerText = 'Iniciar Sesión';
                btnAction.innerText = 'Ingresar';
                switchBtn.innerText = '¿No tienes cuenta? Regístrate aquí';
            }
        }

        function handleAuth() {
            const email = document.getElementById('login_email').value.trim();
            const password = document.getElementById('login_password').value;

            if (!email || !password) {
                showMessage('Por favor completa todos los campos', 'error-message');
                return;
            }

            const users = getStoredUsers();

            if (isRegisterMode) {
                if (users[email]) {
                    showMessage('Este correo ya está registrado.', 'error-message');
                } else {
                    users[email] = password;
                    localStorage.setItem('zoomi_users', JSON.stringify(users));
                    showMessage('¡Cuenta registrada con éxito! Ahora inicia sesión.', 'success-message');
                    setTimeout(() => toggleMode(), 1200);
                }
            } else {
                if (users[email] && users[email] === password) {
                    alert('¡Inicio de sesión exitoso!');
                    closeLogoutModal();
                } else {
                    showMessage('Correo o contraseña incorrectos. Si no tienes cuenta, haz clic abajo para registrarte.', 'error-message');
                }
            }
        }

        function showMessage(text, typeClass) {
            const msg = document.getElementById('modal-msg');
            msg.innerText = text;
            msg.className = `message ${typeClass}`;
            msg.style.display = 'block';
        }
    </script>

</body>
</html>
