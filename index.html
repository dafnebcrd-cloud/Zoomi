<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoomi</title>
  <style>
    /* Estilos básicos para el Modal y las Alertas */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .button-group {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 50%;
    }

    .btn-primary {
      background-color: #800000;
      color: white;
    }

    .btn-secondary {
      background-color: #ccc;
      color: #333;
    }

    .alert-message {
      display: none;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 14px;
      text-align: center;
    }

    .toggle-mode-container {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .toggle-mode-container a {
      color: #800000;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- MODAL DE INICIAR SESIÓN / REGISTRO -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modalTitle">Iniciar Sesión</h2>
      
      <!-- Cuadro de alertas -->
      <div id="authAlert" class="alert-message"></div>

      <form id="authForm">
        <div class="input-group">
          <label for="authEmail">Correo electrónico:</label>
          <input type="email" id="authEmail" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="input-group">
          <label for="authPassword">Contraseña:</label>
          <input type="password" id="authPassword" placeholder="••••••••" required>
        </div>

        <div class="button-group">
          <button type="button" id="cancelBtn" class="btn-secondary">Cancelar</button>
          <button type="submit" id="submitAuthBtn" class="btn-primary">Ingresar</button>
        </div>
      </form>

      <div class="toggle-mode-container">
        <p id="toggleText">¿No tienes cuenta? <a href="#" id="switchAuthLink">Regístrate aquí</a></p>
      </div>
    </div>
  </div>

  <!-- PANTALLA PRINCIPAL DE ZOOMI (OCULTA HASTA INICIAR SESIÓN) -->
  <div id="mainApp" style="display: none; padding: 20px;">
    <header>
      <h1 id="welcomeUserMessage">Bienvenido a Zoomi</h1>
      <button id="logoutBtn" class="btn-primary" style="width: auto;">Cerrar sesión</button>
    </header>
  </div>

  <!-- SCRIPT CON LA LÓGICA DE FIREBASE Y VALIDACIONES -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      sendEmailVerification, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Reemplaza estas credenciales si cambian en tu consola de Firebase
    const firebaseConfig = {
      apiKey: "TU_API_KEY_AQUÍ",
      authDomain: "zoomi-aa021.firebaseapp.com",
      projectId: "zoomi-aa021",
      storageBucket: "zoomi-aa021.appspot.com",
      messagingSenderId: "TU_MESSAGING_SENDER_ID",
      appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const authModal = document.getElementById("authModal");
    const mainApp = document.getElementById("mainApp");
    const modalTitle = document.getElementById("modalTitle");
    const authForm = document.getElementById("authForm");
    const authEmail = document.getElementById("authEmail");
    const authPassword = document.getElementById("authPassword");
    const submitAuthBtn = document.getElementById("submitAuthBtn");
    const toggleText = document.getElementById("toggleText");
    const authAlert = document.getElementById("authAlert");
    const welcomeUserMessage = document.getElementById("welcomeUserMessage");
    const logoutBtn = document.getElementById("logoutBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    let isRegisterMode = false;

    function showAlert(message, isError = true) {
      authAlert.textContent = message;
      authAlert.style.color = isError ? "#721c24" : "#155724";
      authAlert.style.backgroundColor = isError ? "#f8d7da" : "#d4edda";
      authAlert.style.border = isError ? "1px solid #f5c6cb" : "1px solid #c3e6cb";
      authAlert.style.display = "block";
    }

    function clearAlert() {
      authAlert.style.display = "none";
      authAlert.textContent = "";
    }

    function setAuthMode(register) {
      isRegisterMode = register;
      clearAlert();
      authForm.reset();

      if (isRegisterMode) {
        modalTitle.textContent = "Crear Cuenta";
        submitAuthBtn.textContent = "Registrarse";
        toggleText.innerHTML = '¿Ya tienes cuenta? <a href="#" id="switchAuthLink">Inicia sesión aquí</a>';
      } else {
        modalTitle.textContent = "Iniciar Sesión";
        submitAuthBtn.textContent = "Ingresar";
        toggleText.innerHTML = '¿No tienes cuenta? <a href="#" id="switchAuthLink">Regístrate aquí</a>';
      }

      document.getElementById("switchAuthLink").addEventListener("click", (e) => {
        e.preventDefault();
        setAuthMode(!isRegisterMode);
      });
    }

    setAuthMode(false);

    // Requisito de seguridad: mínimo 8 caracteres, al menos 1 mayúscula y 1 número
    function isPasswordStrong(password) {
      const regex = /^(?=.*[A-Z])(?=.*\d).{8,}$/;
      return regex.test(password);
    }

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();

      const email = authEmail.value.trim();
      const password = authPassword.value;

      if (isRegisterMode) {
        // --- FILTRO DE SEGURIDAD EN REGISTRO ---
        if (!isPasswordStrong(password)) {
          showAlert("La contraseña debe tener al menos 8 caracteres, incluir una mayúscula y un número.");
          return;
        }

        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          // Enviar correo de verificación para asegurar que el correo es real
          await sendEmailVerification(user);
          await signOut(auth);

          showAlert("¡Cuenta creada! Se ha enviado un correo de confirmación. Por favor verifícalo antes de iniciar sesión.", false);
          
          setTimeout(() => {
            setAuthMode(false);
          }, 4000);

        } catch (error) {
          if (error.code === 'auth/email-already-in-use') {
            showAlert("Este correo electrónico ya está registrado. Cambia a 'Iniciar sesión'.");
          } else {
            showAlert("Error al registrarse: " + error.message);
          }
        }

      } else {
        // --- FILTRO DE SEGURIDAD EN INICIO DE SESIÓN ---
        try {
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          // Si el correo no está verificado, no permite ingresar
          if (!user.emailVerified) {
            showAlert("Tu correo aún no ha sido verificado. Revisa tu bandeja de entrada o spam.");
            await signOut(auth);
            return;
          }

          authModal.style.display = "none";
          mainApp.style.display = "block";

        } catch (error) {
          showAlert("Correo o contraseña incorrectos.");
        }
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user && user.emailVerified) {
        welcomeUserMessage.textContent = `Bienvenido ${user.email.split('@')[0]}`;
        authModal.style.display = "none";
        mainApp.style.display = "block";
      } else {
        mainApp.style.display = "none";
        authModal.style.display = "flex";
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      setAuthMode(false);
    });

    cancelBtn.addEventListener("click", () => {
      authForm.reset();
      clearAlert();
    });
  </script>
</body>
</html>
