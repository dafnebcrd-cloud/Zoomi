<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoomi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PANTALLA PRINCIPAL DE ZOOMI -->
  <div id="mainApp">
    <header class="app-header">
      <div class="logo-container">
        <img src="logo.png" alt="Zoomi Logo" class="app-logo">
      </div>
      <h1 id="welcomeUserMessage">Bienvenido a Zoomi</h1>
      <button id="logoutBtn" class="btn-logout" style="display: none;">Cerrar sesión</button>
    </header>

    <main class="content-body">
      <!-- Aquí van tus lecciones y el mapa de la app -->
    </main>
  </div>

  <!-- MODAL DE INICIAR SESIÓN / REGISTRO -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modalTitle">Iniciar Sesión</h2>
      
      <!-- Mensajes de Alerta -->
      <div id="authAlert" class="alert-message" style="display: none;"></div>

      <form id="authForm">
        <div class="input-group">
          <label for="authEmail">Correo electrónico:</label>
          <input type="email" id="authEmail" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="input-group">
          <label for="authPassword">Contraseña:</label>
          <input type="password" id="authPassword" placeholder="••••••••" required>
        </div>

        <div class="button-group">
          <button type="button" id="cancelBtn" class="btn-secondary">Cancelar</button>
          <button type="submit" id="submitAuthBtn" class="btn-primary">Ingresar</button>
        </div>
      </form>

      <div class="toggle-mode-container">
        <p id="toggleText">¿No tienes cuenta? <a href="#" id="switchAuthLink">Regístrate aquí</a></p>
      </div>
    </div>
  </div>

  <!-- VÍNCULO AL SCRIPT SEPARADO -->
  <script type="module" src="app.js"></script>
</body>
</html>
